<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 配合 env(safe-area-inset-*) 处理刘海/底部安全区 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>我们的小世界</title>
    <!-- PWA：可安装到手机主屏 + 独立窗口 + 状态栏配色 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ff6f7d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小世界" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 工业拟物字体：Inter（无衬线主体）+ JetBrains Mono（工程数字/标签） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
