name: iOS Build

# iOS 云构建（GitHub macOS runner）：在 Windows 本机也能产出 ipa。
# 触发：手动运行（Actions → iOS Build → Run workflow）或 mobile/ 有改动时。
#
# 【签名与分发说明】
# 1) 无证书时：构建 unsigned archive（CODE_SIGNING_ALLOWED=NO），验证工程可编译并产出未签名 ipa
#    （不能直接安装，仅供检查产物）。
# 2) 要安装到 iPhone，需在 GitHub 仓库 Secrets 配置（Settings → Secrets → Actions）：
#    - IOS_SIGNING_CERT_BASE64 : 开发者证书 .p12 的 base64（keytool 等价物是 security 导入）
#    - IOS_SIGNING_CERT_PASSWORD: .p12 密码
#    - IOS_PROVISIONING_PROFILE_BASE64: 描述文件 .mobileprovision 的 base64
#    配置后本 workflow 自动跳过 CODE_SIGNING_ALLOWED=NO，改用自动签名导出真机 ipa。
# 3) 免费开发者账号也能用（7 天签名），正式分发需付费账号（¥688/年，TestFlight/上架）。

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'

jobs:
  ios:
    runs-on: macos-latest
    # Actions 禁止在 if 条件直接引用 secrets（语法校验报错），
    # 因此先把证书 secrets 注入 job 级 env，if 统一判断 env.HAS_CERT。
    env:
      HAS_CERT: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor deps
        run: |
          node --version && npm --version
          cd mobile && npm install --no-audit --no-fund

      - name: Sync iOS platform
        run: cd mobile && npx cap sync ios

      - name: Import signing cert & profile (when configured)
        if: ${{ env.HAS_CERT != '' }}
        env:
          CERT_B64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/ios_cert.p12
          echo "$PROFILE_B64" | base64 --decode > /tmp/ios_profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/ios_profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/ios_cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Archive (signed if cert configured, else unsigned verify-build)
        env:
          HAS_CERT: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
        run: |
          cd mobile/ios/App
          if [ -n "$HAS_CERT" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive archive
          else
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
          fi

      - name: Export IPA
        env:
          HAS_CERT: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
        run: |
          cd mobile/ios/App
          if [ -n "$HAS_CERT" ]; then
            xcodebuild -exportArchive -archivePath build/App.xcarchive \
              -exportOptionsPlist <(cat <<EOF
                {
                  "method": "ad-hoc",
                  "signingStyle": "automatic",
                  "stripSwiftSymbols": true
                }
              EOF
              ) -exportPath build/export
          else
            # 未签名产物（供全能签/AltStore 等工具签名安装）：
            # 标准 ipa 结构 Payload/App.app，保留全部 Frameworks/PlugIns。
            mkdir -p build/export/Payload
            cp -R build/App.xcarchive/Products/Applications/App.app build/export/Payload/
            cd build/export
            zip -q -r ../export/App-unsigned.ipa Payload
            rm -rf Payload
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: mobile/ios/App/build/export/*.ipa
          if-no-files-found: error

      # 直链交付（未签名场景）：ipa 上传到免费临时文件服务，链接打印在日志，
      # 手机/电脑直接下载即可（配合全能签等重签工具安装，无需登录 GitHub）。
      - name: Upload unsigned ipa to direct-link service
        if: ${{ env.HAS_CERT == '' }}
        run: |
          IPA=mobile/ios/App/build/export/App-unsigned.ipa
          echo "========== 未签名 ipa 直链（48 小时内有效，请尽快下载） =========="
          echo "-- file.io --"
          curl -s -F "file=@$IPA" https://file.io
          echo ""
          echo "-- tmpfiles 备用 --"
          curl -s -F "file=@$IPA" https://tmpfiles.org/api/v1/upload
          echo ""
          echo "========== 以上任一链接即 App-unsigned.ipa =========="
