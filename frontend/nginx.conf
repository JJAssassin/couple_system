worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# 加载动态模块（含 apk 包 nginx-mod-http-brotli 提供的 brotli_static / brotli_filter 模块）。
# 注意：必须用 apk 安装的 nginx（与模块同一次构建，ABI 一致）；Docker 官方 nginx 镜像的
# core 是源码编译，与 apk 模块 ABI 不兼容，会报 "module ... is not binary compatible"。
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ---- 预压缩静态资源协商（构建期 Vite 插件已为 dist 内每个资源产出 .br / .gz 副本）----
    # 客户端 Accept-Encoding 含 br → 直接返回同名 .br；含 gzip → 返回 .gz；都没有 → 原始文件。
    # 优先级：brotli 优于 gzip（nginx 在两者皆支持时优先 br）。仅对静态产物生效，
    # /api、/uploads、/hub 走反代不在此列。
    brotli_static on;
    gzip_static on;
    # 兜底实时压缩：仅当某资源缺失 .br/.gz 且体积达标时，由 nginx 实时压缩（brotli 模块已随上面装入）。
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---- 安全响应头（方向#4 安全加固）----
        # X-Frame-Options: DENY 防点击劫持；nosniff 防 MIME 嗅探；Referrer-Policy 减少泄露；
        # Permissions-Policy 限制摄像头/麦克风等能力。
        # nginx add_header 继承规则：location 有 add_header 时会覆盖 server 级，
        # 因此本片段在 server 级与每个带 add_header 的 location 里都 include。
        # 注意：未启用 Content-Security-Policy —— Vue/naive/ECharts 依赖内联样式与 blob/data，
        # 盲配 CSP 易致白屏；如需启用须先按实际资源逐项收敛。
        include /etc/nginx/security-headers.conf;

        # 带内容哈希的静态资源：文件名即版本，但用 no-cache 而非 immutable。
        # 原因：本地会反复 rebuild，旧 hash 文件会从服务器删除；若用 immutable 永久缓存，
        # 浏览器会一直引用已删除的旧 chunk 导致白屏。no-cache 让浏览器每次重新验证，
        # 内容不变则 304 复用、内容变了则 200 拉新，彻底规避“旧 JS 指向已删 chunk”。
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # SPA（Vue Router history 模式）回退：非资源请求都交给 index.html。
        # index.html 本身设 no-cache，确保发版后浏览器每次重新验证、立即拿到新的资源引用。
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # PWA manifest：nginx alpine 镜像的 mime.types 缺 .webmanifest 映射（默认 octet-stream），
        # 而 Chromium 的可安装性检查要求 application/manifest+json 等 JSON 类 MIME。
        # 这里用 location 级 types 覆盖（仅替换本 location 的类型表，不影响 /assets 的 js/css/png）。
        location = /manifest.webmanifest {
            include /etc/nginx/security-headers.conf;
            types { application/manifest+json webmanifest; }
            add_header Cache-Control "no-cache";
        }

        # 后端 REST API（前端 baseURL 为相对路径 /api，由 nginx 同源反代，规避 CORS）
        # 用变量 + Docker 内嵌 DNS（127.0.0.11）resolver：backend 容器重建（IP 变化）后
        # nginx 会自动重新解析，避免启动时缓存旧 IP 导致 502 Bad Gateway（曾踩此坑）。
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend_upstream http://backend:5199;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 上传文件（头像 / 封面 / 相册图）
        location /uploads/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend_upstream http://backend:5199;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR 实时同步（WebSocket / 长轮询）。必须透传 Upgrade 头。
        location /hub/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend_upstream http://backend:5199;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # OTA 分发目录（version.json + our-little-world-release.apk）。
        # APK（WebView 源 https://localhost）跨域 fetch /app/version.json 检测更新、下载安装包，
        # 浏览器对跨域 GET 强制 CORS，故需显式返回 Access-Control-Allow-Origin: https://localhost，
        # 否则 APK 内 fetch 被拦截（与后端 Program.cs 的 AppCors 白名单保持一致）。
        location /app/ {
            include /etc/nginx/security-headers.conf;
            add_header Access-Control-Allow-Origin "https://localhost" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
    }
}
