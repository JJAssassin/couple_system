# 情侣小世界 —— 一键容器化部署
# 用法：
#   1) cp .env.example .env   # 按需修改密码
#   2) docker compose up -d --build
#   3) 浏览器访问 http://localhost:8080
#
# 端口规划（与本机已运行的 3306/6379/5199 错开，互不冲突）：
#   宿主机 8080 -> frontend(nginx:80) -> 反代 /api /uploads /hub -> backend:5199
#   宿主机 3307 -> mysql:3306   （仅调试用，正常不直连）
#   宿主机 6380 -> redis:6379   （仅调试用）

services:
  mysql:
    image: mysql:8.0.39
    container_name: couple_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: couple_love
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: couple_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: couple_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5199
      # 连接串指向 compose 网络内的 mysql 服务（端口 3306）
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=couple_love;User=${MYSQL_USER};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;"
      # 生产强制 Redis TokenStore（Program.cs 会校验）
      TokenStore__Provider: Redis
      TokenStore__Configuration: "redis:6379"
      TokenStore__KeyPrefix: "auth:rt:"
      Email__Enabled: "false"
    volumes:
      # JWT RSA 私钥：挂载进容器，JwtKeyResolver 会从 /app/keys/jwt-private.pem 读取
      - ./secrets/jwt-private.pem:/app/keys/jwt-private.pem:ro
      # 上传文件持久化（否则容器重建图片丢失）
      - uploads-data:/app/uploads
    expose:
      - "5199"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: couple_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # HTTPS 反代层：把 80/443 流量透传到 frontend(nginx:80)
  # 默认自签证书（tls internal）；切真域名见 Caddyfile 注释
  caddy:
    image: caddy:2-alpine
    container_name: couple_caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  caddy-data:
  caddy-config:
