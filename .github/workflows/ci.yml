name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一 ref 的重复触发会取消进行中的运行，省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试 (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 后端构建
        run: dotnet build backend/CoupleLoveSystem.Api/CoupleLoveSystem.Api.csproj -c Debug

      - name: 后端测试 (InMemory，无外部 DB 依赖)
        run: dotnet test backend/CoupleLoveSystem.Tests/CoupleLoveSystem.Tests.csproj -c Debug --no-build

  frontend:
    name: 前端测试 / 类型检查 / 构建 / 体积门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        # 用 npm install 而非 npm ci：npmmirror 镜像 vue 元数据偶发异常导致
        # lock 严格校验/peer 解析失败；--legacy-peer-deps 规避 ERESOLVE，本项目依赖树固定，安全
        run: npm install --legacy-peer-deps --no-audit

      - name: 单元测试 (vitest)
        working-directory: frontend
        run: |
          if ! npm test 2>&1 | tee /tmp/vitest.log; then
            echo "::error::vitest 失败，末尾日志："
            tail -40 /tmp/vitest.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: 类型检查 + 生产构建 (vue-tsc --noEmit && vite build)
        working-directory: frontend
        run: npm run build

      - name: 体积门禁 (echarts ≤700KB / naive ≤900KB)
        working-directory: frontend
        shell: bash
        run: |
          node -e '
            const fs=require("fs"),path=require("path");
            const dir="dist/assets";
            if(!fs.existsSync(dir)){console.error("dist/assets 不存在，前端构建可能未产出");process.exit(1);}
            const files=fs.readdirSync(dir).filter(f=>f.endsWith(".js"));
            const kb=f=>Math.round(fs.statSync(path.join(dir,f)).size/1024);
            const pick=re=>files.find(f=>re.test(f));
            const ec=pick(/^echarts-.*\.js$/);
            const nv=pick(/^naive-.*\.js$/);
            if(!ec){console.error("体积门禁：未在 dist/assets 找到 echarts chunk");process.exit(1);}
            if(!nv){console.error("体积门禁：未在 dist/assets 找到 naive chunk");process.exit(1);}
            const e=kb(ec), n=kb(nv);
            console.log("echarts chunk: "+e+" KB");
            console.log("naive chunk:  "+n+" KB");
            let bad=false;
            if(e>700){console.error("失败：echarts "+e+"KB 超 700KB 阈值（疑似回归为全量引入）");bad=true;}
            if(n>900){console.error("失败：naive "+n+"KB 超 900KB 阈值（疑似重新全量注册 app.use(NaiveUi)）");bad=true;}
            process.exit(bad?1:0);
          '

  # ─────────────────────────────────────────────────────────────
  # 全栈集成冒烟：GitHub service container 起 MySQL 8.0.39，
  # 后端 MigrateAsync 自动迁移建表 + 种子，再跑仓库内 scripts/smoke.py
  # （登录 + 30 只读 + 11 写闭环 + 401 门）。仅依赖 MySQL，使用 InMemory
  # TokenStore（Development 环境，规避 Production 对 Redis 的强制要求），
  # JWT 用临时生成的 RSA 私钥（环境变量注入，不入库）。
  # 这一步能在 CI 中复现「从迁移全新建库」场景，正是最容易遗漏的回归点
  # （例如某次 EnhanceBoard 迁移因缺 [Migration] 特性未被应用，导致 /board 500）。
  # ─────────────────────────────────────────────────────────────
  integration:
    name: 全栈集成冒烟 (MySQL + 后端 + 冒烟脚本)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: couple_love
          MYSQL_USER: app
          MYSQL_PASSWORD: apppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=127.0.0.1;Port=3306;Database=couple_love;User=app;Password=apppass;CharSet=utf8mb4;SslMode=None;AllowPublicKeyRetrieval=true;"
      TokenStore__Provider: InMemory
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 生成 RSA 私钥 (JWT 签名，不入库)
        run: |
          openssl genrsa -out jwt-private.pem 2048
          echo "JWT_RSA_PRIVATE_KEY<<EOF" >> "$GITHUB_ENV"
          cat jwt-private.pem >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: 构建后端
        run: dotnet build backend/CoupleLoveSystem.Api/CoupleLoveSystem.Api.csproj -c Debug

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 启动后端并跑全栈冒烟
        run: |
          dotnet run --project backend/CoupleLoveSystem.Api --urls http://localhost:5199 > /tmp/backend.log 2>&1 &
          BGPID=$!
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:5199/ ; then echo "backend is up"; break; fi
            sleep 2
          done
          sleep 5
          python scripts/smoke.py
          RC=$?
          kill $BGPID 2>/dev/null || true
          exit $RC

      - name: 失败诊断
        if: failure()
        run: |
          echo "----- backend startup log -----"
          tail -n 80 /tmp/backend.log || true
